[profile.default]
solc_version = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
src = "src"
out = "out"
libs = ["lib"]

remappings = [
  "openzeppelin-contracts/=lib/openzeppelin-contracts/",
  "@uniswap/v4-core/=lib/uniswap-v4-core/",
  "@uniswap/v4-periphery/=lib/uniswap-v4-periphery/"
]


